# Serve keypage/index.html as a Telegram Mini App (HTTPS required). Put this inside the existing
# `server { listen 443 ssl; ... }` block, BEFORE any catch-all `location /`, then: nginx -t && nginx -s reload
#   mkdir -p /var/www/osh/keypage && cp keypage/index.html /var/www/osh/keypage/
# Note: `alias <file>` + `index` from the server block yields "...index.htmlindex.php is not a directory" (500);
# root + try_files avoids that (verified).
location = /osh/keypage/ {
    root /var/www;
    try_files /osh/keypage/index.html =404;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
